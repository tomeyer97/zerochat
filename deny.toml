# cargo-deny: `cargo deny check` checks advisories, licences, bans and sources.
# CI runs it in the `audit` job (.github/workflows/ci.yml). Docs: https://embarkstudios.github.io/cargo-deny/
# No [graph] targets: every platform's dependencies are checked (the release builds Linux and macOS).

[advisories]
# The RustSec advisory database. Vulnerabilities, unmaintained/unsound crates and yanked
# versions fail the check, unless listed in `ignore` with a reason and a date to revisit.
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # url 2.5.8: stack overflow in Url::origin() on nested blob: URLs. zerochat never calls
    # Url::origin(). Fixed in url 2.5.9 (`cargo update -p url`, a Cargo.lock change).
    # Revisit by 2027-01-31.
    { id = "RUSTSEC-2026-0592", reason = "fix is a Cargo.lock update (cargo update -p url); Url::origin() is not called; revisit by 2027-01-31" },
    # libsqlite3-sys 0.30 bundles SQLite < 3.54.0 (CVE-2026-119375). Needs a local attacker who can
    # write the database and its -wal file; zerochat opens Zeroshot's own databases read-only.
    # Fixed in rusqlite 0.41 (libsqlite3-sys 0.39): a breaking upgrade of rusqlite 0.32.
    # Revisit by 2027-02-28.
    { id = "RUSTSEC-2026-0459", reason = "fix needs the rusqlite 0.32 -> 0.41 upgrade; local attacker only; revisit by 2027-02-28" },
]

[licenses]
# Only permissive licences, exactly the ones the dependency tree uses today. A new licence fails
# the check on purpose: add it here only after reading it (copyleft needs the maintainer's decision).
allow = [
    "Apache-2.0",          # most crates (alone or as MIT OR Apache-2.0)
    "BSD-3-Clause",        # subtle; matchit (MIT AND BSD-3-Clause)
    "CDLA-Permissive-2.0", # webpki-roots (Mozilla's root certificates)
    "ISC",                 # ring, rustls-webpki, untrusted
    "MIT",
    "Unicode-3.0",         # icu_*, unicode-ident (Unicode data)
]
confidence-threshold = 0.93
unused-allowed-license = "deny"

[bans]
# Version `*` (any version) is not allowed. Today this warns instead of failing: the workspace's
# own path dependency (zerochat -> zsf) counts as a wildcard until the crates say
# `publish = false`. Set `wildcards = "deny"` once they do.
wildcards = "warn"
allow-wildcard-paths = true
# Two versions of one crate are common in a tree this size (windows-sys, syn, ...): report, don't fail.
multiple-versions = "warn"

[sources]
# crates.io only: no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
