name: Feature request
description: Suggest a new feature or a change to one.
labels: ["feature", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Larger ideas are easier to shape in [Discussions](https://github.com/tomeyer97/zerochat/discussions) first. Before writing code, wait until the maintainer agrees on the approach (see [CONTRIBUTING.md](https://github.com/tomeyer97/zerochat/blob/main/CONTRIBUTING.md)).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What would solve it? Where in the UI or the command line would it live?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways you considered, or how you work around it now.
  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I would like to open a pull request for this.
