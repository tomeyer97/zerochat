# The build-setup steps of build-local-artifacts in .github/workflows/release.yml (github-build-setup in
# dist-workspace.toml): zerochat embeds the built web UI (web/dist) at compile time, and every archive
# carries THIRD_PARTY_NOTICES.md (made by the `notices` job). release.yml is edited by hand
# (allow-dirty = ["ci"]); keep these steps the same as there. Actions are pinned by commit SHA.
- name: Set up Node
  uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
  with:
    node-version: 22
- name: Build the web UI
  run: npm --prefix web ci && npm --prefix web run build
- name: Fetch THIRD_PARTY_NOTICES.md
  uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
  with:
    name: artifacts-notices
    path: .
