# dist (formerly cargo-dist): GitHub Releases archives for zerochat and zsf.
# `dist plan` shows what a release would build. A release only happens when a maintainer pushes a
# version tag (v0.1.0) and approves the `release` environment: nothing here publishes by itself.
# .github/workflows/release.yml started as `dist generate` output and is hardened by hand
# (allow-dirty below keeps dist from overwriting it); it also lays out and publishes the npm packages
# from the same archives (npm/build.js from-dist), so npm users get the attested binaries.

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.34.0"
ci = "github"
# release.yml is edited by hand (permissions, SHA pins, tests first, environment gate, npm, SBOMs):
# `dist generate` must not overwrite it, and `dist plan` must not fail because it differs.
allow-dirty = ["ci"]
# A `curl | sh` installer (docs/install.md says how to verify it). Add "powershell" together with a
# Windows target.
installers = ["shell"]
# The same platforms as the npm packages (npm/zerochat/packages.json). Linux is static musl, so one
# build runs on any distribution. No Windows until zsf builds there (README: "Windows: use WSL").
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
install-path = "CARGO_HOME"
checksum = "sha256"
github-attestations = true
# Licences of everything compiled into the binaries (scripts/third-party-notices.sh); release.yml
# generates it before dist builds, so every archive carries it.
include = ["THIRD_PARTY_NOTICES.md"]
# PRs run nothing; only a pushed version tag starts the release workflow.
pr-run-mode = "skip"
# The server embeds web/dist at compile time: build the web UI first (steps in .github/build-setup.yml).
github-build-setup = "../build-setup.yml"

[dist.github-custom-runners]
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"

# The commits `dist generate` would pin the actions to (the same as release.yml).
[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803" # v6.1.0
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9" # v7.0.2
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333" # v8.0.2
"actions/attest" = "1e69f48acb82d1966a394da916b4c1698aa569d6" # v4.2.2
