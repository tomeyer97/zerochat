# cargo-about: the licences of the crates compiled into zerochat and zsf, for THIRD_PARTY_NOTICES.md
# (scripts/third-party-notices.sh). Dev and build dependencies are not part of the binaries.
# A crate under a licence missing here fails the script: check the licence, then add it.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Licence texts of crates whose manifests need clarifying (cargo-about's built-in workarounds).
workarounds = ["ring", "rustls"]
# Only the release targets (dist-workspace.toml): a crate used on Windows alone is not shipped.
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
